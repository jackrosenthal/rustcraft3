<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafarazzo TD Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Left: dangers ahead, what each fantas unlocks, and the towers' tech tree.  Right: a
   strip with the level being fought, the next one, its countdown, and its warning, over
   the 40 levels as a command card, past ones dimmed.  One dark look after the Warcraft III
   console, as the static level sheet. */
:root{color-scheme:dark;
--bg:#07090c;--stone:#12161c;--panel:#0b0e13;--fg:#f2efe4;--muted:#a59f8e;
--gold:#fcd20d;--trim:#b08a2e;--trim-dark:#4a3810;--bevel:#2b313b;
--air:#63c8ff;--boss:#ff4b3a;--fan:#49e04f;
--display:"Cinzel","Palatino Linotype",Palatino,Georgia,serif;--body:"Alegreya Sans","Trebuchet MS","Segoe UI",sans-serif;
font-size:min(1.7vh,0.96vw)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 0%,#1a212b 0%,var(--bg) 70%) var(--bg);color:var(--fg);font:500 1rem/1.25 var(--body);font-variant-numeric:lining-nums}
.wrap{height:100%;padding-block:1rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-rows:auto minmax(0,1fr);gap:.8rem}
header{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;border-bottom:.15rem solid var(--trim);box-shadow:0 .15rem 0 var(--trim-dark);padding:0 .4rem .5rem}
h1{font:900 2.5rem/1 var(--display);margin:0;color:var(--gold);letter-spacing:.03em;text-shadow:0 .12rem 0 #000,0 0 1rem rgba(252,210,13,.25)}
header .map{color:var(--muted);font-size:1.3rem;flex:1;min-width:0}
/* Our health: the lives left of the most the game has had, green to gold to red. */
.health{display:flex;align-items:center;gap:.6rem;flex:0 1 32rem;min-width:16rem;--hp:var(--fan)}
.health.mid{--hp:var(--gold)} .health.low{--hp:var(--boss)}
.health .hl{font:700 1.2rem/1 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--hp)}
.health .bar{flex:1;height:1.7rem;background:#000;border:.14rem solid var(--trim);outline:.07rem solid #000;position:relative;overflow:hidden}
.health .bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%) var(--hp);box-shadow:0 0 .8rem var(--hp);transition:width .4s ease-out}
.health b{font:900 2rem/1 var(--display);color:var(--hp);font-variant-numeric:tabular-nums lining-nums;min-width:4.5ch;text-align:right;text-shadow:0 .1rem 0 #000}
.health.hit .bar{animation:hit .9s ease-out}
@keyframes hit{0%{box-shadow:0 0 1.6rem .3rem var(--boss);border-color:var(--boss)}100%{box-shadow:none}}
.status{font:700 1.05rem var(--body);letter-spacing:.08em;text-transform:uppercase;padding:.25rem .6rem;border:.1rem solid currentColor;background:#000}
.status.live{color:var(--fan)} .status.paused{color:var(--gold)} .status.down{color:var(--boss)} .status.lobby{color:var(--air)}
button{font:700 1.05rem var(--body);color:var(--fg);background:linear-gradient(180deg,#2a303a,#11151b);border:.14rem solid var(--trim);padding:.35rem .8rem;cursor:pointer}
button:hover{border-color:var(--gold)} button[aria-pressed="true"]{color:var(--gold);box-shadow:inset 0 0 .6rem rgba(252,210,13,.35)}
main{display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);gap:.9rem;min-height:0}
.side{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:.6rem;min-height:0;overflow-y:auto}
/* The panels above the tech tree keep their content's height; the tree takes what is left
   and scrolls. */
.side>.box:not(:last-child){min-height:auto}
.right{display:grid;grid-template-rows:auto minmax(0,1fr);gap:.6rem;min-height:0;min-width:0}
.box{background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%) var(--panel);border:.14rem solid var(--trim);outline:.07rem solid #000;box-shadow:inset 0 0 0 .07rem var(--trim-dark),inset 0 0 1.2rem #000;padding:.6rem .9rem;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.4rem}
h2{font:700 1.2rem/1 var(--display);letter-spacing:.09em;text-transform:uppercase;margin:0;color:var(--gold);text-shadow:0 .08rem 0 #000}
.tag{font:700 .95rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:.2rem .35rem;background:#000;border:.07rem solid currentColor}
.air{color:var(--air)} .boss{color:var(--boss)} .fan{color:var(--fan)}
/* The strip over the grid: the level now, the next with its countdown; before an air or
   boss level it turns into that level's warning, pulsing through the countdown; at the
   end, the victory or defeat. */
.strip{display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;padding:.35rem .9rem;background:#000;border:.14rem solid var(--trim);outline:.07rem solid #000;color:var(--fg);min-width:0}
.strip .now{color:var(--muted);font-size:1.3rem} .strip .now b{color:var(--fg);font-variant-numeric:tabular-nums lining-nums}
.strip .nx{display:flex;align-items:center;gap:.5rem;flex:1;flex-wrap:wrap;min-width:0;font:700 1.4rem/1.1 var(--body)}
.strip .nx .k{font:700 1rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.strip .nx .n{font:900 1.8rem/1 var(--display)}
.strip .what{font:900 1.35rem/1.05 var(--display);letter-spacing:.05em;text-transform:uppercase}
.strip .what small{display:block;font:600 1.05rem var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.strip .count{font:900 2.1rem/1 var(--display);color:var(--gold);font-variant-numeric:tabular-nums lining-nums;margin-left:auto}
.strip.boss{border-color:var(--boss);color:var(--boss);box-shadow:0 0 1.4rem rgba(255,75,58,.45),inset 0 0 1rem rgba(255,75,58,.3)}
.strip.air{border-color:var(--air);color:var(--air);box-shadow:0 0 1.4rem rgba(99,200,255,.4),inset 0 0 1rem rgba(99,200,255,.25)}
.strip.urgent{animation:pulse .8s ease-in-out infinite}
.strip.victory,.strip.defeat{justify-content:center;font:900 2.4rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase}
.strip.victory{color:var(--gold);border-color:var(--gold);box-shadow:0 0 1.6rem rgba(252,210,13,.5)}
.strip.defeat{color:var(--boss);border-color:var(--boss);box-shadow:0 0 1.6rem rgba(255,75,58,.5)}
@keyframes pulse{50%{filter:brightness(1.6)}}
@media (prefers-reduced-motion:reduce){.strip.urgent,.cell.next,.health.hit .bar{animation:none}}
.ahead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.ahead div{background:#000;border:.1rem solid currentColor;padding:.4rem .5rem;display:flex;flex-direction:column;gap:.15rem}
.ahead span{font:700 .95rem var(--body);letter-spacing:.1em;text-transform:uppercase}
.ahead b{font:900 1.7rem/1 var(--display);font-variant-numeric:lining-nums}
.ahead em{font-style:normal;color:var(--muted);font-size:1.1rem}
table{border-collapse:collapse;width:100%;font-size:1.25rem}
th{font:700 .95rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 .4rem .15rem}
td{padding:.2rem .4rem;border-top:.07rem solid var(--bevel)}
.n{text-align:right;font-variant-numeric:tabular-nums lining-nums} th.n{text-align:right}
.scroll{overflow:auto;min-height:0}
/* What each fantas unlocks, after the static sheet's table; a fantas had shows solid. */
td.lv{font:700 1.5rem/1 var(--display);width:2.6rem;color:var(--fan)}
tr.had td strong{color:var(--fan)} tr.had td strong::after{content:" \2713";font-size:.9em} tr.later{opacity:.6}
td strong{display:block;font-weight:700;line-height:1.1}
.req{display:block;color:var(--muted);font-size:1.05rem;line-height:1.15}
td.gold{color:var(--gold)}
/* The tech tree: each tower a chip; an upgrade chain runs on one line (›), a branch opens
   an indented list, a builder's buildings and a building's trained builder each get a line. */
.tt,.tt ul{list-style:none;margin:0;padding:0}
.tt ul{padding-left:1.1rem;border-left:.1rem solid var(--bevel);margin:.15rem 0 .15rem .35rem}
.tt li{margin:.22rem 0;line-height:1.55}
.tt .via{font:700 .8rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:.3rem}
.tt .arr{color:var(--trim);margin:0 .2rem}
.tw{display:inline-flex;align-items:baseline;gap:.3rem;padding:.05rem .4rem;background:#000;border:.07rem solid var(--bevel);font-size:1.08rem;white-space:nowrap}
.tw .g{color:var(--gold);font-variant-numeric:tabular-nums lining-nums;font-size:.95rem}
.tw .h{font:700 .75rem var(--body);letter-spacing:.06em}
.tw .h.air{color:var(--air)} .tw .h.ground{color:#d9a066} .tw .h.both{color:var(--fg)}
.tw .nd{font-size:.85rem;color:var(--muted)}
.tw .nd.fan{color:var(--fan);font-weight:700}
.tw.fan{border-color:var(--fan)} .tw.locked{opacity:.5}
.grid{list-style:none;margin:0;padding:.45rem;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:.35rem;min-height:0;
background:var(--stone);border:.14rem solid var(--trim);outline:.07rem solid #000;box-shadow:inset 0 0 0 .07rem var(--trim-dark),inset 0 0 2rem #000}
.cell{position:relative;background:linear-gradient(160deg,#1c222b,#0b0e12 60%);border:.14rem solid var(--bevel);border-top-color:#444c59;border-left-color:#444c59;border-bottom-color:#06080a;border-right-color:#06080a;padding:.35rem .55rem;display:flex;flex-direction:column;justify-content:space-between;min-width:0;min-height:0;overflow:hidden}
.cell .top{display:flex;justify-content:space-between;align-items:flex-start;gap:.3rem}
.cell b{font:900 1.85rem/.9 var(--display);color:#7d8697;text-shadow:0 .1rem 0 #000}
.marks{display:flex;flex-direction:column;align-items:flex-end;gap:.15rem}
.cell .tag{font-size:.78rem;padding:.15rem .25rem;letter-spacing:.04em}
.cell .name{font:700 1.15rem/1.05 var(--body);color:var(--fg)}
dl{margin:0;display:grid;font-size:1.15rem;line-height:1.1}
dl div{display:flex;justify-content:space-between;gap:.4rem}
dt{color:var(--muted)} dd{margin:0;font-variant-numeric:tabular-nums lining-nums} dd.gold{color:var(--gold)}
.cell.air{border-color:var(--air);box-shadow:inset 0 0 1.1rem rgba(99,200,255,.28)}
.cell.fan{border-color:var(--fan);box-shadow:inset 0 0 1.1rem rgba(73,224,79,.25)}
.cell.air.fan{border-color:var(--fan) var(--air) var(--air) var(--fan)}
.cell.boss{border-color:var(--boss);box-shadow:inset 0 0 1.4rem rgba(255,75,58,.4)}
.cell.air b{color:var(--air)} .cell.fan b{color:var(--fan)} .cell.air.fan b{color:var(--air)} .cell.boss b{color:var(--boss)}
.cell.done{opacity:.32;filter:saturate(.4)}
.cell.now{outline:.22rem solid var(--gold);outline-offset:-.05rem;box-shadow:0 0 1.4rem rgba(252,210,13,.55),inset 0 0 1.2rem rgba(252,210,13,.25)}
/* Next: a dashed outline that pulses, beside Now's solid gold one; no label to cover a cell's numbers. */
.cell.next{outline:.18rem dashed var(--fg);outline-offset:-.05rem;animation:nextglow 1.6s ease-in-out infinite}
@keyframes nextglow{50%{filter:brightness(1.35)}}
/* An HSBC finished: a gold banner over the page's top for a few seconds. */
.kaching{position:fixed;left:50%;top:1rem;transform:translate(-50%,calc(-100% - 2rem));z-index:10;display:flex;align-items:center;gap:.8rem;padding:.7rem 1.4rem;background:#000;border:.18rem solid var(--gold);box-shadow:0 0 2rem rgba(252,210,13,.6),inset 0 0 1rem rgba(252,210,13,.3);font:900 2rem/1 var(--display);color:var(--gold);letter-spacing:.04em;text-shadow:0 .12rem 0 #000;transition:transform .35s ease-out;pointer-events:none;max-width:calc(100vw - 32px)}
.kaching.on{transform:translate(-50%,0)} .kaching small{font:600 1.2rem var(--body);color:var(--fg);letter-spacing:0}
.sw{display:inline-block;width:.8rem;height:.8rem;margin-right:.5rem;border:.07rem solid #000;vertical-align:-.05rem}
.empty{color:var(--muted)}
/* Portrait and small screens: stack and scroll instead of fitting one screen. */
@media (max-aspect-ratio:5/4),(max-width:820px){
:root{font-size:16px} html,body{height:auto} .wrap{height:auto;display:flex;flex-direction:column}
main{display:flex;flex-direction:column} .side{display:flex;flex-direction:column} .right{display:flex;flex-direction:column}
.tw{white-space:normal} .strip .nx{flex-basis:100%}
.grid{grid-template-columns:repeat(auto-fill,minmax(8.6rem,1fr));grid-template-rows:none} .cell{gap:.5rem;min-height:8rem}
header .map{order:5;flex-basis:100%} .health{order:6;flex-basis:100%} header .status{margin-left:auto}
}
</style>
</head>
<body>
<div class="kaching" id="kaching" role="status" aria-live="polite"></div>
<div class="wrap">
<header>
  <h1>Mafarazzo TD</h1>
  <span class="map" id="map">Connecting…</span>
  <div class="health" id="health" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
    <span class="hl">Health</span><div class="bar"><i id="hpFill"></i></div><b id="hpText">–</b>
  </div>
  <span class="status down" id="status">Offline</span>
  <button id="sound" aria-pressed="false" title="Sounds before air and boss levels, as lives are lost, at the end, when an HSBC is built, and on falling under 10 lives">Sound: off</button>
  <button id="test" title="Play the boss, air, countdown, life-lost, HSBC, and under-10-lives sounds">Test</button>
</header>
<main>
<div class="side">
  <section class="box">
    <h2>Ahead</h2>
    <div class="ahead" id="ahead"></div>
  </section>
  <section class="box">
    <h2>Fantas unlocks</h2>
    <table><thead><tr><th>Lvl</th><th>Unlocks</th><th class="n">Gold</th></tr></thead><tbody id="unlocks"></tbody></table>
  </section>
  <section class="box">
    <h2>Tech tree</h2>
    <div class="scroll"><ul class="tt" id="tech"></ul></div>
  </section>
</div>
<div class="right">
  <div class="strip" id="strip" role="status"></div>
  <ol class="grid" id="grid"></ol>
</div>
</main>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
// The game's player colors, by color index (the HSBC banner's builder).
const COLORS = ["#ff0303","#0042ff","#1ce6b9","#540081","#fffc01","#fe8a0e","#20c000","#e55bb0","#959697","#7ebff1","#106246","#4e2a04"];
const fmt = n => n >= 10000 ? (Math.round(n / 1000) + "k") : n.toLocaleString();
const goldText = g => g[0] === g[1] ? fmt(g[0]) : `${fmt(g[0])}–${fmt(g[1])}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kinds = l => [l.boss && "boss", l.air && "air", l.fantas && "fan"].filter(Boolean);
const tagsHtml = l => (l.fantas ? '<span class="tag fan">Fantas</span>' : "") + (l.air ? '<span class="tag air">Air</span>' : "") + (l.boss ? '<span class="tag boss">Boss</span>' : "");
const danger = l => l && (l.boss ? "boss" : l.air ? "air" : null);

// ---- Sound: the game's own files, served by the game (/sound/<file>), fetched and
// decoded as the page loads.  Browsers start the audio only after a click or key on the
// page, so a page reopened with sound on starts it on the first one anywhere.
const SOUNDS = { "heads-up": "heads-up.wav", boss: "boss.wav", air: "air.wav", tick: "tick.wav", death: "death.wav", victory: "victory.mp3", defeat: "defeat.mp3", kaching: "kaching.wav", nuke: "nuke.mp3" };
let soundOn = false;
try { soundOn = localStorage.getItem("tddash.sound") === "1"; } catch (e) {}
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const buffers = {};
const loaded = Object.fromEntries(Object.entries(SOUNDS).map(([name, file]) => [name,
  fetch(`/sound/${file}`).then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
    .then(b => ctx.decodeAudioData(b)).then(buf => (buffers[name] = buf))
    // The nuke's file is the host's own and may be missing: nukeSiren stands in.
    .catch(e => name !== "nuke" && console.warn("sound", name, e))]));
function unlock() { if (ctx.state !== "running") ctx.resume().then(showSound, () => {}); }
for (const ev of ["pointerdown", "keydown", "touchend"]) document.addEventListener(ev, unlock, { capture: true });
ctx.onstatechange = () => showSound();
function play(name, force) {
  if (!soundOn && !force) return;
  const buf = buffers[name];
  if (!buf) return;
  const src = ctx.createBufferSource();
  src.buffer = buf; src.connect(ctx.destination); src.start();
}
// One death cry per life lost: lives lost together play one after another, each cry of an
// unbroken run faster than the one before (by DEATH_SPEEDUP, up to DEATH_FASTEST times) and
// starting sooner after the last (its sped-up length, shrunk by DEATH_SPEEDUP again per cry,
// so later cries overlap, down to DEATH_MIN_GAP apart). The run's pace starts over once
// every cry has finished.
const DEATH_SPEEDUP = 1.25, DEATH_FASTEST = 4, DEATH_MIN_GAP = 0.05;
let deathsNext = 0, deathsEnd = 0, deathRun = 0;
function playDeaths(n, force) {
  if (!soundOn && !force) return;
  const buf = buffers.death;
  if (!buf) return;
  for (let i = 0; i < n; i++) {
    if (ctx.currentTime >= deathsEnd) deathRun = 0;
    const k = deathRun++, rate = Math.min(DEATH_SPEEDUP ** k, DEATH_FASTEST), len = buf.duration / rate;
    const src = ctx.createBufferSource(), at = Math.max(ctx.currentTime, deathsNext);
    src.buffer = buf; src.playbackRate.value = rate; src.connect(ctx.destination); src.start(at);
    deathsEnd = Math.max(deathsEnd, at + len);
    deathsNext = at + Math.max(len / DEATH_SPEEDUP ** k, DEATH_MIN_GAP);
  }
}
// Falling under 10 lives: a tactical nuke incoming.  The host's own file if it gave one,
// or a made one: an air-raid klaxon wailing up and down three times under a spoken
// warning.
function nukeSiren(a) {
  const t0 = a.currentTime + 0.05, out = a.createGain(), shape = a.createWaveShaper(), lp = a.createBiquadFilter();
  const curve = new Float32Array(1024);
  for (let i = 0; i < curve.length; i++) { const x = i / 511.5 - 1; curve[i] = Math.tanh(3 * x); }
  shape.curve = curve; lp.type = "lowpass"; lp.frequency.value = 2600;
  shape.connect(lp); lp.connect(out); out.connect(a.destination);
  const WAIL = 1.4, N = 3, end = t0 + WAIL * N;
  out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(0.32, t0 + 0.08);
  out.gain.setValueAtTime(0.32, end - 0.3); out.gain.linearRampToValueAtTime(0, end);
  for (const detune of [0, 7]) {
    const o = a.createOscillator();
    o.type = "sawtooth"; o.detune.value = detune * 100 / 12;
    for (let i = 0; i < N; i++) {
      const t = t0 + i * WAIL;
      o.frequency.setValueAtTime(260, t);
      o.frequency.exponentialRampToValueAtTime(820, t + WAIL * 0.55);
      o.frequency.exponentialRampToValueAtTime(260, t + WAIL);
    }
    o.connect(shape); o.start(t0); o.stop(end);
  }
  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance("Tactical nuke, incoming!");
    u.rate = 0.9; u.pitch = 0.4; u.volume = 1;
    setTimeout(() => speechSynthesis.speak(u), WAIL * 1000);
  }
}
function playNuke(force) {
  if (!soundOn && !force) return;
  if (buffers.nuke) play("nuke", force); else nukeSiren(ctx);
}
function showSound() {
  const blocked = soundOn && ctx.state !== "running";
  $("sound").textContent = "Sound: " + (!soundOn ? "off" : blocked ? "click to start" : "on");
  $("sound").setAttribute("aria-pressed", soundOn);
}
$("sound").onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem("tddash.sound", soundOn ? "1" : "0"); } catch (e) {}
  if (soundOn) loaded["heads-up"].then(() => play("heads-up"));
  showSound();
};
$("test").onclick = () => {
  Promise.all(Object.values(loaded)).then(() => {
    [["boss", 0], ["air", 2300], ["tick", 4000]].forEach(([n, ms]) => setTimeout(() => play(n, true), ms));
    setTimeout(() => playDeaths(6, true), 4700);
    setTimeout(() => play("kaching", true), 9000);
    setTimeout(() => playNuke(true), 10200);
  });
};
showSound();

// ---- Warnings: each sounded once per level and stage, however often the state comes
// (a new game reloads the page, starting them over).
const warned = new Set();
function warnOnce(key, fn) { if (!warned.has(key)) { warned.add(key); fn(); } }
function alerts(s, next) {
  const kind = danger(next);
  if (!kind) return;
  // While the level before is still being fought: a first heads-up.
  if (s.fight && s.level === next.n - 1) warnOnce(next.n + ":early", () => play("heads-up"));
  if (!s.fight && s.countdown != null) {
    const secs = Math.ceil(s.countdown);
    warnOnce(next.n + ":count", () => play(kind));
    if (secs <= 3 && secs >= 1) warnOnce(next.n + ":tick" + secs, () => play("tick"));
  }
}

// ---- Rendering.
let gridKey = "";
function renderGrid(s) {
  const key = JSON.stringify(s.levels);
  if (key !== gridKey) {
    gridKey = key;
    $("grid").innerHTML = s.levels.map(l => `<li class="cell ${kinds(l).join(" ")}" id="c${l.n}"><div class="top"><b>${l.n}</b><span class="marks">${tagsHtml(l)}</span></div><div class="name">${esc(l.name || "?")}</div><dl><div><dt>Count</dt><dd>${l.count} &times; ${l.spawns}</dd></div><div><dt>HP</dt><dd>${fmt(l.hp)}</dd></div><div><dt>Gold</dt><dd class="gold">${goldText(l.gold)}</dd></div></dl></li>`).join("");
  }
  const upcoming = s.level + 1;
  for (const l of s.levels) {
    const c = $("c" + l.n);
    c.classList.toggle("done", l.n < s.level || (l.n === s.level && !s.fight));
    c.classList.toggle("now", l.n === s.level && s.fight);
    c.classList.toggle("next", l.n === upcoming);
  }
}
// A tower's chip: its name, gold, what it hits, and what else it needs (a fantas by its
// level, dim until the fantas is had).
const HITS = { air: "Air", ground: "Gnd", both: "A+G" };
function chip(t, level) {
  const fan = t.needs.find(n => n.fantas);
  const locked = fan && level < fan.fantas;
  const needs = t.needs.map(n => n.fantas ? `<span class="nd fan">F${n.fantas}</span>` : `<span class="nd">${esc(n.name)}</span>`).join(" ");
  const title = `${t.name}: ${t.gold} gold` + (t.hits ? `, ${t.damage} damage, hits ${t.hits}` : "") + (t.needs.length ? `; needs ${t.needs.map(n => n.fantas ? `the level ${n.fantas} fantas` : n.name).join(", ")}` : "");
  return `<span class="tw${fan ? " fan" : ""}${locked ? " locked" : ""}" title="${esc(title)}">${esc(t.name)} <span class="g">${fmt(t.gold)}</span>${t.hits ? ` <span class="h ${t.hits}">${HITS[t.hits]}</span>` : ""}${needs ? " " + needs : ""}</span>`;
}
const VIA = { build: "builds", train: "trains", upgrade: "›", start: "" };
// A node and what comes from it: a lone upgrade runs on after it, anything else opens a list.
function branch(n, level) {
  let html = chip(n, level);
  let cur = n;
  while (cur.next.length === 1 && cur.next[0].via === "upgrade") {
    cur = cur.next[0];
    html += `<span class="arr">›</span>${chip(cur, level)}`;
  }
  if (cur.next.length) html += `<ul>${cur.next.map(c => `<li>${c.via !== "upgrade" ? `<span class="via">${VIA[c.via]}</span>` : `<span class="arr">›</span>`}${branch(c, level)}</li>`).join("")}</ul>`;
  return html;
}
let techKey = "";
function renderTech(s) {
  const key = s.level + JSON.stringify(s.tech).length;
  if (key === techKey) return;
  techKey = key;
  $("tech").innerHTML = s.tech.map(n => `<li>${branch(n, s.level)}</li>`).join("");
  $("unlocks").innerHTML = s.unlocks.length ? s.unlocks.map(u => {
    const others = u.needs.filter(n => !n.fantas).map(n => esc(n.name));
    return `<tr class="${s.level < u.level ? "later" : "had"}"><td class="lv">${u.level}</td><td><strong>${esc(u.name)}</strong><span class="req">${u.from ? `from ${esc(u.from)}` : ""}${others.length ? ` · needs ${others.join(", ")}` : ""}</span></td><td class="n gold">${fmt(u.gold)}</td></tr>`;
  }).join("") : `<tr><td class="empty" colspan="3">None</td></tr>`;
}
// The strip: now, next, countdown, warning, or the game's end.
function renderStrip(s, cur, next) {
  const st = $("strip");
  if (s.outcome) {
    st.className = "strip " + s.outcome;
    st.textContent = s.outcome === "victory" ? "Victory" : "Defeat";
    return;
  }
  const now = !cur ? "Building phase" : s.fight ? `Level <b>${cur.n}</b> · <b>${s.creeps}</b>/${cur.count * cur.spawns} left` : `Level <b>${cur.n}</b> cleared`;
  const soon = !s.fight && s.countdown != null;
  const count = soon ? `<span class="count">${Math.ceil(s.countdown)}s</span>` : "";
  if (!next) { st.className = "strip"; st.innerHTML = `<span class="now">${now}</span>`; return; }
  const kind = danger(next);
  let what = "";
  if (kind === "boss") what = `<span class="what">Boss incoming<small>${next.count * next.spawns} &times; ${esc(next.name)}, ${fmt(next.hp)} HP each</small></span>`;
  else if (kind === "air") what = `<span class="what">Air incoming<small>Only anti-air towers can hit them</small></span>`;
  st.className = "strip" + (kind ? " " + kind : "") + (kind && soon ? " urgent" : "");
  st.innerHTML = `<span class="now">${now}</span><span class="nx"><span class="k">Next</span><span class="n ${kinds(next).join(" ")}">${next.n}</span>${esc(next.name)} ${tagsHtml(next)}</span>${what}${count}`;
}
// The header's health bar; a lost life flashes it.
let lastLives = null;
const NUKE_AT = 10;
function renderHealth(s) {
  const max = Math.max(s.lives_max, s.lives, 1), pct = Math.max(0, s.lives) / max, h = $("health");
  $("hpFill").style.width = (pct * 100) + "%";
  $("hpText").textContent = `${s.lives}/${max}`;
  h.setAttribute("aria-valuemax", max); h.setAttribute("aria-valuenow", s.lives);
  h.classList.toggle("mid", pct <= 0.6 && pct > 0.3); h.classList.toggle("low", pct <= 0.3);
  if (lastLives !== null && s.lives < lastLives) {
    h.classList.remove("hit"); void h.offsetWidth; h.classList.add("hit");
    playDeaths(lastLives - s.lives);
    // Under 10 lives: once each time the lives fall through it.
    if (lastLives >= NUKE_AT && s.lives < NUKE_AT) playNuke();
  }
  lastLives = s.lives;
}
// An HSBC finished since the last state: its banner and ka-ching.  (None for those
// finished before the page opened.)
let lastHsbc = null, kachingHide = 0;
function renderHsbc(s) {
  const n = s.hsbc ? s.hsbc.built : 0;
  if (lastHsbc !== null && n > lastHsbc) {
    const by = s.hsbc.by, k = $("kaching");
    k.innerHTML = `<span>Ka-ching! HSBC built</span>${by ? `<small><span class="sw" style="background:${COLORS[by[1]] || "#888"}"></span>${esc(by[0])}</small>` : ""}`;
    k.classList.add("on");
    clearTimeout(kachingHide); kachingHide = setTimeout(() => k.classList.remove("on"), 5000);
    play("kaching");
  }
  lastHsbc = n;
}
// The host's lobby, before the game: its map and people in the strip, the countdown, then
// the game loading.  What the page kept of a game before is forgotten for the next.
function renderLobby(l) {
  lastLives = null; lastHsbc = null; warned.clear(); lastTime = null; gridKey = ""; techKey = ""; seenPlaying = false;
  setStatus(l.loading ? "Loading" : "Lobby", "lobby");
  $("map").textContent = l.map;
  const h = $("health");
  $("hpFill").style.width = "0"; $("hpText").textContent = "–"; h.className = "health";
  h.setAttribute("aria-valuemax", 0); h.setAttribute("aria-valuenow", 0);
  const what = l.loading ? "The game is loading" : l.countdown != null ? "Game starting" : "Waiting for the game to start";
  const people = l.players.map(([name, color]) => `<span><span class="sw" style="background:${COLORS[color] || "#888"}"></span>${esc(name)}</span>`).join(" ");
  const st = $("strip");
  st.className = "strip";
  st.innerHTML = `<span class="now">Lobby · <b>${l.players.length}</b> ${l.players.length === 1 ? "player" : "players"}</span><span class="nx">${people}</span><span class="what">${what}</span>${l.countdown != null && !l.loading ? `<span class="count">${l.countdown}s</span>` : ""}`;
  $("ahead").innerHTML = ""; $("unlocks").innerHTML = ""; $("tech").innerHTML = ""; $("grid").innerHTML = "";
}
function render(s) {
  $("map").textContent = s.map;
  const lv = s.levels, cur = lv[s.level - 1], next = lv[s.level];
  renderHealth(s);
  renderStrip(s, cur, next);
  renderTech(s);
  // The next air, boss, and fantas levels after the one being fought.
  const from = s.level + 1;
  $("ahead").innerHTML = [["air", "Next air", l => l.air], ["boss", "Next boss", l => l.boss], ["fan", "Next fantas", l => l.fantas]].map(([cls, label, f]) => {
    const l = lv.find(l => l.n >= from && f(l));
    return `<div class="${cls}"><span>${label}</span>${l ? `<b>${l.n}</b><em>${l.n === from ? "next level" : `in ${l.n - s.level} levels`}</em>` : `<b>–</b><em>none left</em>`}</div>`;
  }).join("");
  renderGrid(s);
  alerts(s, next);
  renderHsbc(s);
  // The game's end, once, and only when this page saw the game being played (a page
  // opened on a game already over stays quiet).
  if (!s.outcome) seenPlaying = true;
  else if (seenPlaying) warnOnce("outcome", () => play(s.outcome));
}
let seenPlaying = false;

// ---- Live state over a WebSocket, pushed by the game four times a second.  A game time
// that stops moving is a paused game; no message at all for a while, a stalled one.
// The host's lobby serves the page too, its state as it changes; the game takes over the
// same socket as it begins.  The server goes with each game (or a lobby left), so a socket
// lost is that game over: the page waits for a server to come back (the next game, or its
// lobby) and reloads from it, starting the new game fresh, page, sounds, and all.
function setStatus(text, cls) { $("status").textContent = text; $("status").className = "status " + cls; }
let lastTime = null, lastMove = 0, lastMsg = 0, ws = null;
// A game sends four times a second even paused, so this long without a word is a
// connection gone dead without closing (the host's network dropped, say).
const DEAD_AFTER = 10000, POLL_EVERY = 1000;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = ev => {
    let s;
    try { s = JSON.parse(ev.data); } catch (e) { return; }
    if (s.lobby) { lastMsg = 0; renderLobby(s.lobby); return; }
    if (!s.levels) return;
    const now = performance.now();
    lastMsg = now;
    if (s.time !== lastTime) { lastTime = s.time; lastMove = now; }
    const paused = now - lastMove > 1500;
    setStatus(paused ? "Paused" : "Live", paused ? "paused" : "live");
    render(s);
  };
  ws.onclose = lost;
}
function lost() {
  if (ws) { ws.onclose = ws.onmessage = null; ws.close(); ws = null; }
  lastMsg = 0;
  setStatus("Offline", "down");
  waitForServer();
}
// Asks for the state until the server answers, then reloads.
function waitForServer() {
  const timeout = window.AbortSignal && AbortSignal.timeout ? { signal: AbortSignal.timeout(POLL_EVERY * 2) } : {};
  fetch("/state", { cache: "no-store", ...timeout })
    .then(r => { if (!r.ok) throw r.status; location.reload(); })
    .catch(() => setTimeout(waitForServer, POLL_EVERY));
}
setInterval(() => {
  if (!lastMsg) return;
  const quiet = performance.now() - lastMsg;
  if (quiet > DEAD_AFTER) lost();
  else if (quiet > 3000 && $("status").className.includes("live")) setStatus("Stalled", "paused");
}, 1000);
connect();
</script>
</body>
</html>
